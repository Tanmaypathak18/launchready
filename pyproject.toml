[project]
name = "launchready"
version = "0.0.1"
description = "Launch-readiness kit for open-weight LLMs on NVIDIA GPUs."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Tanmay Pathak" }]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.34",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
launchready = "launchready.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchready"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
